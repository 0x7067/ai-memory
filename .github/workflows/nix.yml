name: nix

# Builds the flake on Linux and macOS so the Nix packaging cannot rot unnoticed.
#
# Matrix: x86_64-linux (package + NixOS module eval) and aarch64-darwin
# (package + artifact smoke only). NixOS checks always evaluate x86_64-linux
# and stay on the Linux leg — Darwin attrs would add noise without signal.
#
# ai-memory does not otherwise test on Nix, so without this job `flake.nix`
# is source nobody executes: it can break through a dependency bump, a
# toolchain change, or a new build script and stay green because no other
# job touches it.
#
# Deliberately NOT run on every pull request — a full release build under
# Nix costs far more wall-clock than the rest of the matrix combined, and
# most PRs cannot affect it. It runs when an input to the Nix build
# actually changes, on a weekly schedule to catch upstream drift, and on
# demand.
on:
  push:
    branches: [main]
    paths:
      - 'flake.nix'
      - 'nix/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'scripts/check-nix-packaging.sh'
      - '.github/workflows/nix.yml'
  pull_request:
    paths:
      - 'flake.nix'
      - 'nix/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'scripts/check-nix-packaging.sh'
      - '.github/workflows/nix.yml'
  schedule:
    # Mondays 05:17 UTC. Off the hour so it does not pile onto the
    # top-of-hour scheduling spike.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: nix build (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # `nix flake check` would also evaluate every output; the build is the
      # claim worth verifying, and it is the expensive half anyway.
      - run: nix build --print-build-logs '.#packages.${{ matrix.system }}.default'
      - run: scripts/check-nix-packaging.sh ./result
      # Eval-only smoke tests for the NixOS module (nixosModules.default):
      # proves the option wiring evaluates cleanly for both enable = true
      # and enable = false on a real Linux system, without building a full
      # NixOS system closure. See nix/nixos-module.nix and the assertions
      # in flake.nix's checks.x86_64-linux.
      - if: matrix.system == 'x86_64-linux'
        run: nix build --print-build-logs '.#checks.x86_64-linux.nixos-module-eval'
      - if: matrix.system == 'x86_64-linux'
        run: nix build --print-build-logs '.#checks.x86_64-linux.nixos-sandbox-parity'
